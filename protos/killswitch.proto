syntax = "proto3";

package killswitch;

message Flag {
    string name        = 1;
    bool   enabled     = 2;
    string description = 3;
}

message FlagChangeRequest {
    Flag   flag       = 1;
    string changed_by = 2;
    string reason     = 3;
}

message FlagChangeResponse {
    bool   success = 1;
    string message = 2;
}

message PolicyRequest {
    Flag            current_flag    = 1;
    Flag            proposed_change = 2;
    string          changed_by      = 3;
    repeated Flag   context_flags   = 4;  // untuk evaluasi mutex
}

message PolicyResponse {
    bool   approved       = 1;
    string denial_reason  = 2;
}

message FlagUpdate {
    Flag   flag        = 1;
    string changed_by  = 2;
    int64  timestamp   = 3;
    string change_type = 4;
}

message AuditRecord {
    string flag_name     = 1;
    bool   old_value     = 2;
    bool   new_value     = 3;
    string changed_by    = 4;
    int64  changed_at    = 5;
    string reason        = 6;
    string policy_result = 7;
}

message AuditQuery {
    string flag_name = 1;
    int32  limit     = 2;
}

message AuditHistoryResponse {
    repeated AuditRecord records = 1;
}

message FlagQuery {
    string name = 1;
}

message FlagList {
    repeated Flag flags = 1;
}

message Empty {}

service FlagStore {
    rpc SetFlag   (FlagChangeRequest) returns (FlagChangeResponse);
    rpc GetFlag   (FlagQuery)         returns (Flag);
    rpc ListFlags (Empty)             returns (FlagList);
}

service PolicyEvaluator {
    rpc ValidateChange (PolicyRequest) returns (PolicyResponse);
}

service Broadcaster {
    rpc SubscribeFlags (Empty)      returns (stream FlagUpdate);
    rpc NotifyChange   (FlagUpdate) returns (Empty);
}

service AuditLogger {
    rpc LogChange     (AuditRecord)  returns (Empty);
    rpc GetHistory    (AuditQuery)   returns (AuditHistoryResponse);
    rpc StreamHistory (Empty)        returns (stream AuditRecord);
}
